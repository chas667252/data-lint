name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test on the dirty example
        run: |
          python data_lint.py examples/orders_dirty.csv --key order_id || status=$?
          if [ "${status:-0}" -ne 1 ]; then
            echo "expected exit code 1 (issues found), got ${status:-0}"
            exit 1
          fi

      - name: Smoke test on the clean example
        run: python data_lint.py examples/orders_clean.csv
